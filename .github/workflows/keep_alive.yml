name: Keep-Alive Cloud Inference Engine

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier container from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping FastAPI Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping CliniScan AI Health Endpoint
        run: |
          echo "Dispatching keep-alive ping to Render backend..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" --max-time 60 https://cliniscan-ai.onrender.com/api/health)
          echo "$response"
